[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "struphy-plots"
version = "0.1.0"
description = "Optional plotting and diagnostics for labeled Struphy output"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Max Lindqvist", email = "max.lindqvist@ipp.mpg.de" }]
requires-python = ">=3.10"
dependencies = ["matplotlib", "numpy", "xarray", "ipywidgets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
pyvista = ["pyvista", "imageio"]
profiling = ["scope-profiler[pproc]"]
# interactive figures: array.struphy.plotly and struphy_plots.plotly_plots
plotly = ["plotly"]
# the output helpers of the struphy-hub example gallery (struphy_plots.gallery): Plotly figures,
# their static PNGs (kaleido) and the profiling export, which needs scope-profiler 0.6.1 or newer
gallery = ["plotly", "kaleido", "scope-profiler[pproc]>=0.6.1"]
dev = ["pytest", "ruff", "h5py", "griffe"]

[project.urls]
Homepage = "https://github.com/struphy-hub/struphy-plots"
Repository = "https://github.com/struphy-hub/struphy-plots"
Documentation = "https://struphy-hub.github.io/struphy-plots"
Issues = "https://github.com/struphy-hub/struphy-plots/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Restrict collection to our own tests: the struphy submodule now lives at
# ./struphy (with its own nested feectools submodule), and bare `pytest`
# would otherwise recurse into their test suites too -- and fail on their
# own optional dependencies (e.g. psydac) that struphy-plots has no need of.
testpaths = ["tests"]
# Real struphy simulations (compiled kernels, ~1 min): skipped unless requested with
# `pytest --run-simulations` (see tests/conftest.py); run in the docs workflow.
markers = ["simulation: runs a real struphy simulation; needs compiled kernels"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E265",
    "E402",
    "E701",
    "E722",
    "E731",
    "E741",
    "E742",
    "E743",
    "E902",
    "F401",
    "F403",
    "F405",
    "F841",
]
