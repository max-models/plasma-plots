[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-plots"
version = "0.1.0"
description = "Plots and diagnostics of labeled xarray output from plasma simulations, such as Struphy"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Max Lindqvist", email = "max.lindqvist@ipp.mpg.de" }]
requires-python = ">=3.11"
dependencies = ["matplotlib", "numpy", "xarray", "ipywidgets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.scripts]
plasma-plots = "plasma_plots.cli:main"

[project.optional-dependencies]
# Read netCDF3 and netCDF4 files through xarray (including the CLI).
netcdf = ["netCDF4"]
pyvista = ["pyvista", "imageio"]
profiling = ["scope-profiler[pproc]"]
# backend="plotly": interactive Plotly versions of the plots; kaleido saves them as PNG/SVG/PDF
plotly = ["plotly", "kaleido"]
# backend="tikz": TikZ/pgfplots versions of the plots, converted by maxplotlib (compiled with pdflatex)
tikz = ["maxplotlibx>=0.2.0"]
# the output helpers of the struphy-hub example gallery (plasma_plots.gallery): Plotly figures,
# their static PNGs (kaleido) and the profiling export, which needs scope-profiler 0.6.1 or newer
gallery = ["plotly", "kaleido", "scope-profiler[pproc]>=0.6.1"]
dev = ["pytest", "ruff", "h5py", "griffe"]
# plasma_plots.from_desc: evaluating DESC equilibria (tests/test_desc.py, the DESC guide)
desc = ["desc-opt"]

[project.urls]
Homepage = "https://github.com/max-models/plasma-plots"
Repository = "https://github.com/max-models/plasma-plots"
Documentation = "https://max-models.github.io/plasma-plots"
Issues = "https://github.com/max-models/plasma-plots/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Restrict collection to our own tests: the struphy submodule now lives at
# ./struphy (with its own nested feectools submodule), and bare `pytest`
# would otherwise recurse into their test suites too -- and fail on their
# own optional dependencies (e.g. psydac) that plasma-plots has no need of.
testpaths = ["tests"]
# Real struphy simulations (compiled kernels, ~1 min): skipped unless requested with
# `pytest --run-simulations` (see tests/conftest.py); run in the docs workflow.
markers = ["simulation: runs a real struphy simulation; needs compiled kernels"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E265",
    "E402",
    "E701",
    "E722",
    "E731",
    "E741",
    "E742",
    "E743",
    "E902",
    "F401",
    "F403",
    "F405",
    "F841",
]
