[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=61",
]

[project]
name = "plasma-plots"
version = "0.1.1"
description = "Plots and diagnostics of labeled xarray output from plasma simulations, such as Struphy"
readme = "README.md"
license.text = "MIT"
authors = [
  { email = "max.lindqvist@ipp.mpg.de", name = "Max Lindqvist" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "ipywidgets",
  "matplotlib",
  "numpy",
  "xarray",
]
optional-dependencies.desc = [
  "desc-opt",
]
optional-dependencies.dev = [
  "griffe",
  "h5py",
  "pytest",
  "ruff",
]
optional-dependencies.gallery = [
  "kaleido",
  "plotly",
  "scope-profiler[pproc]>=0.6.1",
]
optional-dependencies.netcdf = [
  "netcdf4",
]
optional-dependencies.plotly = [
  "kaleido",
  "plotly",
]
optional-dependencies.profiling = [
  "scope-profiler[pproc]",
]
optional-dependencies.pyvista = [
  "imageio",
  "pyvista",
]
optional-dependencies.tikz = [
  "maxplotlibx>=0.2",
]
urls.Documentation = "https://max-models.github.io/plasma-plots"
urls.Homepage = "https://github.com/max-models/plasma-plots"
urls.Issues = "https://github.com/max-models/plasma-plots/issues"
urls.Repository = "https://github.com/max-models/plasma-plots"
scripts.plasma-plots = "plasma_plots.cli:main"

[tool.setuptools]
packages.find.where = [
  "src",
]

[tool.ruff]
line-length = 120
lint.select = [
  "E4",
  "E7",
  "E9",
  "F",
]
lint.ignore = [
  "E265",
  "E402",
  "E701",
  "E722",
  "E731",
  "E741",
  "E742",
  "E743",
  "E902",
  "F401",
  "F403",
  "F405",
  "F841",
]

[tool.pytest]
ini_options.markers = [
  "simulation: runs a real struphy simulation; needs compiled kernels",
]
ini_options.testpaths = [
  "tests",
]
