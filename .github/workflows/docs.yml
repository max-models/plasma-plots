name: Deploy docs

on:
  push:
    branches: [devel]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Every docs figure comes from a real struphy simulation (see
      # scripts/generate_docs_figures.py), so the full compiled struphy
      # runtime is required here, not just struphy-plots. It has compiled
      # dependencies (pyccel/mpi4py), hence the system packages below.
      - name: Install struphy system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gfortran gcc g++ \
            liblapack-dev libblas-dev libopenmpi-dev openmpi-bin \
            libnetcdf-dev libnetcdff-dev cmake

      - name: Install struphy (postprocessing branch)
        run: pip install "struphy @ git+https://github.com/struphy-hub/struphy.git@postprocessing"

      - name: Install struphy-plots (with PyVista and profiling)
        run: pip install -e ".[pyvista,profiling]"

      # The docs embed live interactive Plotly charts (via <PlotlyChart>) to
      # demonstrate `array.struphy.data`; plotly is not a struphy-plots
      # dependency, only needed here to export each figure's JSON.
      - name: Install Plotly (docs examples only)
        run: pip install plotly

      # A few example figures render an interactive PyVista scene off-screen
      # (3-D volumes, equilibria), which needs a virtual display and Mesa's
      # software OpenGL/EGL implementation.
      - name: Install headless rendering dependencies
        run: |
          sudo apt-get install -y xvfb libgl1 libglx-mesa0 libosmesa6

      - name: Generate example figures
        run: xvfb-run -a make figures

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: make docs-install

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
