name: Docs

on:
  push:
    branches: [devel]
  # Pull requests build the site (and run the real-simulation tests) as a check;
  # only pushes to devel deploy it.
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Reuse compiled Struphy/GVEC, DESC, LaTeX and rendering dependencies.
    container:
      image: ghcr.io/max-models/plasma-plots:devel
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      options: --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Use this checkout's code without resolving or replacing image dependencies.
      - name: Install current plasma-plots source
        run: python -m pip install --no-deps -e .

      # scope-profiler[pproc] pins an older maxplotlib than our TikZ backend.
      # Install its remaining tools directly, retaining the image's maxplotlib.
      # The image already supplies scope-profiler, Jupyter, Matplotlib and Plotly.
      - name: Install docs-only profiling and interactive rendering tools
        run: |
          python -m pip install flameprof pyarrow pyvis snakeviz textual
          # VTK 9.7 needs newer trame-vtk; this overrides Struphy's older pin
          # only for the docs' interactive PyVista exports.
          python -m pip install trame-pyvista "trame-vtk>=2.11.15,<2.11.17"

      # The plotting layer on real struphy output: small torus, guiding-center and
      # slab runs (tests/test_real_simulations.py, ~1 min), and the `plasma-plots`
      # command on them. They need the compiled kernels, so they run here rather
      # than in the test workflow.
      - name: Run real-simulation tests
        run: xvfb-run -a pytest -s -v --run-simulations tests/test_real_simulations.py

      - name: Generate example figures
        run: xvfb-run -a make figures

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: make docs-install

      - name: Build site
        working-directory: docs
        run: npm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
