name: Tests

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite exercises struphy_plots against real struphy output
      # objects (struphy.post_processing.output.Output and friends), so
      # struphy itself has to be installed. It has compiled dependencies
      # (pyccel/mpi4py), hence the system packages below. struphy comes from
      # the `struphy` submodule (pinned to a known-good commit), not a fresh
      # clone, so the version used here is reproducible.
      - name: Install struphy system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gfortran gcc g++ \
            liblapack-dev libblas-dev libopenmpi-dev openmpi-bin \
            libnetcdf-dev libnetcdff-dev cmake

      - name: Install struphy (from the struphy submodule)
        run: pip install ./struphy

      - name: Install struphy-plots with dev dependencies
        run: pip install -e ".[dev,profiling,pyvista]"

      # The PyVista tests build scenes off-screen, which needs a virtual display
      # and Mesa's software OpenGL. Tests marked `simulation` (real struphy runs,
      # compiled kernels) are skipped here and run in the docs workflow.
      - name: Install headless rendering dependencies
        run: sudo apt-get install -y xvfb libgl1 libglx-mesa0 libosmesa6

      - name: Run tests
        run: xvfb-run -a pytest -v

      - name: Lint
        run: ruff check src tests scripts
