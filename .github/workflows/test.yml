name: Tests

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite exercises struphy_plots against real struphy output
      # objects (struphy.post_processing.output.Output and friends), so
      # struphy itself has to be installed. It has compiled dependencies
      # (pyccel/mpi4py), hence the system packages below.
      - name: Install struphy system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gfortran gcc g++ \
            liblapack-dev libblas-dev libopenmpi-dev openmpi-bin \
            libnetcdf-dev libnetcdff-dev cmake

      - name: Install struphy (postprocessing branch)
        run: pip install "struphy @ git+https://github.com/struphy-hub/struphy.git@postprocessing"

      - name: Install struphy-plots with dev dependencies
        run: pip install -e ".[dev,profiling]"

      - name: Run tests
        run: pytest -v

      - name: Lint
        run: ruff check src tests scripts
