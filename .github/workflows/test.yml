name: Tests

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite exercises plasma_plots against real struphy output
      # objects (struphy.post_processing.output.Output and friends), so
      # struphy itself has to be installed. It has compiled dependencies
      # (pyccel/mpi4py), hence the system packages below. The dev extra
      # installs struphy>=3.4.0 from PyPI.
      - name: Install struphy system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gfortran gcc g++ \
            liblapack-dev libblas-dev libopenmpi-dev openmpi-bin \
            libnetcdf-dev libnetcdff-dev cmake

      # Editable, with its `plasma-plots` console script on the PATH (tests/test_cli.py runs it).
      # plotly for backend="plotly" and the command's .html output; without it those tests skip.
      - name: Install plasma-plots with dev dependencies
        run: pip install -e ".[dev,profiling,pyvista,desc,plotly,netcdf]"

      # Runs that do not target main replace the max-models dependencies with their devel
      # branches; PRs to main and the release use PyPI only. Uninstall first: pip keeps an
      # installed package of the same version.
      - name: Install the devel branches of the max-models dependencies
        if: (github.base_ref || github.ref_name) != 'main'
        run: |
          pip uninstall -y -r requirements-devel.txt
          pip install -r requirements-devel.txt

      # plasma_plots.scene exports with trame-pyvista (the scene extra). struphy pins an older
      # trame-vtk than VTK 9.7 needs, so install it separately, as the docs workflow does.
      - name: Install the interactive scene export
        run: pip install trame-pyvista nest-asyncio2

      # The PyVista tests build scenes off-screen, which needs a virtual display
      # and Mesa's software OpenGL. Tests marked `simulation` (real struphy runs,
      # compiled kernels) are skipped here and run in the docs workflow.
      - name: Install headless rendering dependencies
        run: sudo apt-get install -y xvfb libgl1 libglx-mesa0 libosmesa6

      - name: Run tests
        run: xvfb-run -a pytest -v

      - name: Lint
        run: ruff check src tests scripts

  # PyPI rejects direct references (`name @ git+...`): the wheel's metadata must have none.
  no-direct-references:
    if: (github.base_ref || github.ref_name) == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the wheel for direct references
        run: |
          pip install build
          python -m build --wheel
          ! unzip -p dist/*.whl '*.dist-info/METADATA' | grep -E '^Requires-Dist:.* @ '
