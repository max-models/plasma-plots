name: Docker image

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker.yml
      - pyproject.toml
      - src/**
      - tests/test_real_simulations.py
      - tests/test_tikz_backend.py
      - tests/test_gvec.py
      - tests/test_desc.py
      - tests/plot_cases.py
      - tests/conftest.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/max-models/plasma-plots
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          load: true
          tags: plasma-plots:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify kernels, MPI and plotting tools
        run: |
          docker run --rm plasma-plots:test bash -e -c '
            python -m pip check
            python -c "import gvec, desc; print(\"GVEC and DESC imports passed\")"
            struphy compile --status | grep -E "^0 of [1-9][0-9]* Struphy kernels are not compiled"
            pdflatex --version
            plasma-plots --help
            mpirun --allow-run-as-root --oversubscribe -n 2 python -c "from mpi4py import MPI; assert MPI.COMM_WORLD.size == 2"
            python -c "import plotly.graph_objects as go; go.Figure(go.Scatter(y=[1, 2, 3])).write_image(\"/tmp/plotly.png\")"
          '

      - name: Run simulation, equilibrium and LaTeX export tests in the image
        # Native runtimes can close pytest's capture streams; use real stdout/stderr.
        run: |
          docker run --rm --init -v "$PWD/tests:/work/tests:ro" plasma-plots:test \
            xvfb-run -a pytest -s -v --run-simulations \
            tests/test_real_simulations.py tests/test_tikz_backend.py::test_figures_compile \
            tests/test_gvec.py tests/test_desc.py

      - name: Log in to GitHub Container Registry
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Push the image that passed the checks above, without rebuilding it.
      - name: Publish tested image
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/devel') && github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag plasma-plots:test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
